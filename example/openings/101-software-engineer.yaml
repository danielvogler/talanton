# The backbone. Ad copy, knockouts and rubric in one file, because they are the
# same decision written three ways.
#
# `opening` is the number people quote. Five postings can share the title
# "Software Engineer"; only the number says which one, and each opening has its
# own folder of CVs and assessments.
#
# Invented, like the CVs beside it. Example Co does not exist.

opening: 101
id: software-engineer
version: 1
title: Software Engineer
company: Example Co
location: Zürich, CH
workplace: hybrid
employment: full-time
apply_to: apply@example.com
closes: 2026-11-30
salary:
  currency: CHF
  min: 110000
  max: 140000
summary: 'Build and run the services behind a product real customers depend on. Small
  team, direct ownership, Zürich.

  '
pitch: 'We build software that other companies run their work on, which sets the bar:

  it has to be correct, it has to be observable, and somebody has to be able to

  explain what it did and why. Most of what we ship runs unattended against real

  business processes.


  You would own things end to end — the design, the tests, the deployment and the

  pager for it. The work is broad rather than deep: some weeks are the data model,

  some are performance, some are sitting with a customer to work out what the

  system is supposed to do.

  '
responsibilities:
- Design and ship services end to end, from problem framing to production.
- Write the tests that make a change safe to make again next month.
- 'Own reliability for what you ship: tracing, cost, failure modes, rollback.'
- Turn a vague customer process into a specified one.
requirements:
- Production experience with services that real users depended on.
- Strong in at least one language, and the judgement to know when a system needs
  less code rather than more.
- Comfort owning infrastructure — containers, cloud, CI, secrets.
- Right to work in Switzerland, or an existing right to relocate here.
nice_to_have:
- Experience building testing and observability tooling.
- Customer-facing background.
- Open-source work we can read.
knockouts:
- id: work_permit
  test: Can work in Switzerland, or already holds the right to relocate here.
- id: english
  test: Working English, sufficient for customer conversations.
screening:
  min_score: 5.0
rubric:
- id: production_experience
  weight: 40
  guide: "8 — has owned a system in production including its failures: on call,\n    rollbacks,\
    \ cost, an incident that was their fault.\n5 — has shipped something small that real users\
    \ touched.\n2 — prototypes, research code and coursework only. Research and academic\n\
    \    deployments are not interchangeable with commercial ones; a candidate\n    whose\
    \ systems only ever ran as prototypes scores at most 4 here\n    regardless of technical\
    \ sophistication.\n"
- id: engineering_depth
  weight: 30
  guide: "8 — has designed something non-trivial and can say concretely what went\n    wrong\
    \ and what they changed.\n5 — has built something that worked, inside a design somebody\
    \ else set.\n2 — has followed a tutorial to the end.\n"
- id: ownership
  weight: 30
  guide: "8 — evidence of end-to-end ownership: chose the tools, ran the thing,\n    fixed\
    \ it at 3am.\n5 — owned a component within someone else's system.\n2 — always worked inside\
    \ decisions made by others.\n"
must_not_influence:
- Name, gender, age, photograph, marital status.
- Nationality, beyond the stated right to work.
- Prestige of a university or employer as a stand-in for demonstrated ability.
boards:
  linkedin:
    title_max: 200
    body_max: 25000
    setup:
    - Post from the company page, not a personal profile.
    - Choose "Apply on company website" — Easy Apply keeps applications inside LinkedIn where
      the agent cannot see them.
  indeed:
    title: Software Engineer (Backend) — Zürich
    title_max: 100
    body_max: 15000
    setup:
    - Post from an Indeed employer account, sponsored or free.
    - Set the application method to "Email me the applications" pointing at the apply address
      above. Indeed Apply routes candidates through Indeed's own inbox, where the agent cannot
      see them.
    - Indeed also crawls careers pages carrying JobPosting structured data. If you have one,
      the crawl and this posting can duplicate — pick one.
  jobs-ch:
    title_max: 100
    setup:
    - Buy the posting before publishing.
    - Decide German or English; English is fine for engineering roles here.
